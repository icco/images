name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: 25 2 * * 4
jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: "1"
      PKG_CONFIG_PATH: /opt/imagor/lib/pkgconfig
      CGO_CFLAGS: -I/opt/imagor/include
      CGO_LDFLAGS: -L/opt/imagor/lib -Wl,-rpath,/opt/imagor/lib
      LD_LIBRARY_PATH: /opt/imagor/lib
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Install native SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev
          sdk=$(docker create ghcr.io/cshum/imagor-base:vips8.18.5-r14-dev)
          trap 'docker rm "$sdk"' EXIT
          sudo docker cp "$sdk:/opt/imagor" /opt/imagor
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: manual
      - run: go build -a ./...
      - uses: github/codeql-action/analyze@v4
