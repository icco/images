name: yaml-json
on:
  push:
    branches: [main]
  pull_request:
jobs:
  yaml-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-yamllint@v1
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-check
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Install yq
        uses: dcarbone/install-yq-action@v1.3.1
      - name: Format YAML files with yq
        run: |
          find . \( -name "*.yml" -o -name "*.yaml" \) \
            -not -path "./vendor/*" -not -path "./node_modules/*" \
            -not -path "./.git/*" | while read -r file; do
            yq -iP '.' "$file"
          done
      - name: Format JSON files with yq
        run: |
          find . -name "*.json" -not -path "./vendor/*" \
            -not -path "./node_modules/*" -not -path "./.git/*" | while read -r file; do
            yq -iP -o=json '.' "$file"
          done
      - name: Commit formatting changes
        if: github.event_name == 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'style: format YAML and JSON with yq'
          file_pattern: '. :!.github/workflows/*'
          commit_author: GitHub Actions <actions@github.com>
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
