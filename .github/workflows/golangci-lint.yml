name: golangci-lint
on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
permissions:
  contents: read
jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    container: ghcr.io/cshum/imagor-base:vips8.18.6-r14-dev
    env:
      CGO_ENABLED: "1"
      PKG_CONFIG_PATH: /opt/imagor/lib/pkgconfig
      CGO_CFLAGS: -I/opt/imagor/include
      CGO_LDFLAGS: -L/opt/imagor/lib -Wl,-rpath,/opt/imagor/lib
      LD_LIBRARY_PATH: /opt/imagor/lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
