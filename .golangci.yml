# From icco/go-template: keep local and CI lint rules identical.
version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - intrange
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - unparam
    - wastedassign
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go$
        linters:
          - dupl
          - goconst
formatters:
  enable:
    - gofmt
    - goimports
